[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subagent-bridge"
version = "0.1.0"
description = "WSL-first bridge for headless subagents and Codex app-server delivery"
requires-python = ">=3.11"

[project.scripts]
sab = "subagent_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
